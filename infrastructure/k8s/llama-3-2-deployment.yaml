---
# Persistent Volume Claim for model storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-models-pvc
  namespace: voice-ai
  labels:
    app: llama-inference
    component: storage
spec:
  accessModes:
    - ReadOnlyMany  # Multiple pods can read the models
  resources:
    requests:
      storage: 10Gi  # Space for Llama 3.2 models (3B + 1B quantized)
  storageClassName: standard  # Adjust based on your cluster

---
# ConfigMap for Llama inference configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-config
  namespace: voice-ai
  labels:
    app: llama-inference
data:
  # Llama 3.2 3B configuration
  LLAMA_3B_MODEL_PATH: "/models/llama-3.2-3b-instruct-q4_k_m.gguf"
  LLAMA_3B_CONTEXT_SIZE: "4096"
  LLAMA_3B_THREADS: "4"
  LLAMA_3B_BATCH_SIZE: "512"

  # Llama 3.2 1B configuration
  LLAMA_1B_MODEL_PATH: "/models/llama-3.2-1b-instruct-q4_k_m.gguf"
  LLAMA_1B_CONTEXT_SIZE: "2048"
  LLAMA_1B_THREADS: "2"
  LLAMA_1B_BATCH_SIZE: "256"

  # Server configuration
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"

  # ARM optimization
  ARM_NEON_ENABLED: "true"
  QUANTIZATION_TYPE: "Q4_K_M"

---
# Deployment for Llama 3.2 3B (Primary model)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-3b-inference
  namespace: voice-ai
  labels:
    app: llama-inference
    component: llama-3b
    arch: arm64
    version: v1
spec:
  replicas: 2  # HA setup
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0  # Conserve memory during updates

  selector:
    matchLabels:
      app: llama-inference
      component: llama-3b

  template:
    metadata:
      labels:
        app: llama-inference
        component: llama-3b
        arch: arm64
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"

    spec:
      # ARM64 node affinity
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values: ["arm64"]

        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values: ["llama-3b"]
              topologyKey: kubernetes.io/hostname

      nodeSelector:
        kubernetes.io/arch: arm64

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      serviceAccountName: llama-inference

      initContainers:
      # Init container to download/prepare models
      - name: model-downloader
        image: alpine:3.18
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Checking for model files..."
            if [ ! -f /models/llama-3.2-3b-instruct-q4_k_m.gguf ]; then
              echo "Model not found. Please upload model to PVC first."
              echo "Instructions: kubectl cp llama-3.2-3b-instruct-q4_k_m.gguf voice-ai/llama-model-loader:/models/"
              exit 1
            fi
            echo "Model verified successfully"
        volumeMounts:
        - name: model-storage
          mountPath: /models

      containers:
      - name: llama-server
        image: ghcr.io/ggerganov/llama.cpp:server-arm64  # Use official llama.cpp ARM image
        imagePullPolicy: IfNotPresent

        command: ["/app/llama-server"]
        args:
          - "-m"
          - "$(LLAMA_3B_MODEL_PATH)"
          - "--host"
          - "$(SERVER_HOST)"
          - "--port"
          - "$(SERVER_PORT)"
          - "--ctx-size"
          - "$(LLAMA_3B_CONTEXT_SIZE)"
          - "--threads"
          - "$(LLAMA_3B_THREADS)"
          - "--batch-size"
          - "$(LLAMA_3B_BATCH_SIZE)"
          - "--gpu-layers"
          - "0"  # CPU only for ARM
          - "--metrics"  # Enable metrics endpoint

        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        # ARM-optimized resource allocation for 3B model
        resources:
          requests:
            cpu: "2000m"        # 2 cores for 3B model
            memory: "3Gi"       # 3GB for Q4_K_M quantized model + inference
            ephemeral-storage: "1Gi"
          limits:
            cpu: "3000m"        # Allow burst to 3 cores
            memory: "4Gi"       # Max 4GB
            ephemeral-storage: "2Gi"

        env:
        - name: LLAMA_3B_MODEL_PATH
          valueFrom:
            configMapKeyRef:
              name: llama-config
              key: LLAMA_3B_MODEL_PATH
        - name: LLAMA_3B_CONTEXT_SIZE
          valueFrom:
            configMapKeyRef:
              name: llama-config
              key: LLAMA_3B_CONTEXT_SIZE
        - name: LLAMA_3B_THREADS
          valueFrom:
            configMapKeyRef:
              name: llama-config
              key: LLAMA_3B_THREADS
        - name: LLAMA_3B_BATCH_SIZE
          valueFrom:
            configMapKeyRef:
              name: llama-config
              key: LLAMA_3B_BATCH_SIZE
        - name: SERVER_HOST
          valueFrom:
            configMapKeyRef:
              name: llama-config
              key: SERVER_HOST
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: llama-config
              key: SERVER_PORT

        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60  # Model loading takes time
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12  # Allow 2 minutes for startup

        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault

        volumeMounts:
        - name: model-storage
          mountPath: /models
          readOnly: true
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: llm-models-pvc
      - name: tmp
        emptyDir:
          sizeLimit: 2Gi

      dnsPolicy: ClusterFirst

---
# Deployment for Llama 3.2 1B (Fallback model)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-1b-inference
  namespace: voice-ai
  labels:
    app: llama-inference
    component: llama-1b
    arch: arm64
    version: v1
spec:
  replicas: 1  # Single replica for fallback
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  selector:
    matchLabels:
      app: llama-inference
      component: llama-1b

  template:
    metadata:
      labels:
        app: llama-inference
        component: llama-1b
        arch: arm64
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"

    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values: ["arm64"]

      nodeSelector:
        kubernetes.io/arch: arm64

      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      serviceAccountName: llama-inference

      containers:
      - name: llama-server
        image: ghcr.io/ggerganov/llama.cpp:server-arm64
        imagePullPolicy: IfNotPresent

        command: ["/app/llama-server"]
        args:
          - "-m"
          - "$(LLAMA_1B_MODEL_PATH)"
          - "--host"
          - "$(SERVER_HOST)"
          - "--port"
          - "$(SERVER_PORT)"
          - "--ctx-size"
          - "$(LLAMA_1B_CONTEXT_SIZE)"
          - "--threads"
          - "$(LLAMA_1B_THREADS)"
          - "--batch-size"
          - "$(LLAMA_1B_BATCH_SIZE)"
          - "--gpu-layers"
          - "0"
          - "--metrics"

        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        # Smaller resources for 1B model
        resources:
          requests:
            cpu: "1000m"
            memory: "1Gi"
            ephemeral-storage: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
            ephemeral-storage: "1Gi"

        env:
        - name: LLAMA_1B_MODEL_PATH
          valueFrom:
            configMapKeyRef:
              name: llama-config
              key: LLAMA_1B_MODEL_PATH
        - name: LLAMA_1B_CONTEXT_SIZE
          valueFrom:
            configMapKeyRef:
              name: llama-config
              key: LLAMA_1B_CONTEXT_SIZE
        - name: LLAMA_1B_THREADS
          valueFrom:
            configMapKeyRef:
              name: llama-config
              key: LLAMA_1B_THREADS
        - name: LLAMA_1B_BATCH_SIZE
          valueFrom:
            configMapKeyRef:
              name: llama-config
              key: LLAMA_1B_BATCH_SIZE
        - name: SERVER_HOST
          valueFrom:
            configMapKeyRef:
              name: llama-config
              key: SERVER_HOST
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: llama-config
              key: SERVER_PORT

        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 40
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 10

        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault

        volumeMounts:
        - name: model-storage
          mountPath: /models
          readOnly: true
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: llm-models-pvc
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi

---
# Service for Llama 3.2 3B
apiVersion: v1
kind: Service
metadata:
  name: llama-3b-service
  namespace: voice-ai
  labels:
    app: llama-inference
    component: llama-3b
spec:
  type: ClusterIP
  selector:
    app: llama-inference
    component: llama-3b
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP

---
# Service for Llama 3.2 1B
apiVersion: v1
kind: Service
metadata:
  name: llama-1b-service
  namespace: voice-ai
  labels:
    app: llama-inference
    component: llama-1b
spec:
  type: ClusterIP
  selector:
    app: llama-inference
    component: llama-1b
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP

---
# Service Account for Llama inference pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llama-inference
  namespace: voice-ai
  labels:
    app: llama-inference
automountServiceAccountToken: false

---
# HPA for Llama 3.2 3B (auto-scale based on load)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llama-3b-hpa
  namespace: voice-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llama-3b-inference
  minReplicas: 2
  maxReplicas: 4  # Can scale up to 4 on high load
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120  # Wait 2 min before scaling up
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 min before scaling down
      policies:
      - type: Pods
        value: 1
        periodSeconds: 180

---
# PodDisruptionBudget to maintain availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llama-3b-pdb
  namespace: voice-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: llama-inference
      component: llama-3b
