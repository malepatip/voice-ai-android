name: Build and Upload APK

on:
  push:
    branches:
      - 'claude/**'
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "SONIC3_API_KEY=" >> local.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Get APK Info
        id: apk_info
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          APK_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "✅ APK built successfully: $APK_PATH ($APK_SIZE)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-ai-android-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload to Google Drive
        if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
        uses: adityak74/google-drive-upload-git-action@v0.3
        with:
          credentials: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          filename: app/build/outputs/apk/debug/app-debug.apk
          folderId: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          name: voice-ai-android-debug-build-${{ github.run_number }}.apk
          overwrite: "false"

      - name: Create Build Summary
        run: |
          echo "## 🎉 Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 APK Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: ${{ steps.apk_info.outputs.apk_size }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download Options" >> $GITHUB_STEP_SUMMARY
          echo "**Option 1: Google Drive (Automatic)**" >> $GITHUB_STEP_SUMMARY
          echo "- APK automatically uploaded to Google Drive" >> $GITHUB_STEP_SUMMARY
          echo "- Filename: \`voice-ai-android-debug-build-${{ github.run_number }}.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- Open Google Drive on your phone and install directly" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Option 2: GitHub Artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "1. Scroll down to **Artifacts** section" >> $GITHUB_STEP_SUMMARY
          echo "2. Download: \`voice-ai-android-debug-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Transfer to your device" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Quick Install on Android" >> $GITHUB_STEP_SUMMARY
          echo "1. Open Google Drive app on your Android device" >> $GITHUB_STEP_SUMMARY
          echo "2. Find the APK file" >> $GITHUB_STEP_SUMMARY
          echo "3. Tap to install (allow unknown sources if prompted)" >> $GITHUB_STEP_SUMMARY
          echo "4. Grant permissions and test!" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🎉 APK Build Successful!\n\n✅ Debug APK is ready for testing\n\n**Download**: Check the artifacts section of this workflow run\n\n**Size**: ${{ steps.apk_info.outputs.apk_size }}`
            })

